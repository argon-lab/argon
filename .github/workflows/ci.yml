name: CI

on:
  workflow_call:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  console:
    name: Public console build and browser regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            api/go.sum
      - name: Verify public source reproduces embedded assets
        run: bash scripts/sync-ui.sh --check
      - name: Audit complete console dependency tree
        run: npm audit --prefix web
      - name: Start disposable MongoDB replica set
        run: |
          docker run -d --name console-mongo -p 127.0.0.1:27017:27017 mongo:7.0.43 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do docker exec console-mongo mongosh --quiet --eval 'db.adminCommand({ping:1})' && break; sleep 1; done
          docker exec console-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          for i in $(seq 1 30); do docker exec console-mongo mongosh --quiet --eval 'if(!db.hello().isWritablePrimary)quit(1)' && break; sleep 1; done
          docker exec console-mongo mongosh --quiet --eval 'if(!db.hello().isWritablePrimary)quit(1)'
      - name: Build the same engine commit with embedded UI
        working-directory: api
        run: go build -o /tmp/argon-console-api .
      - name: Start production console in isolated demo mode
        run: |
          PORT=18081 ARGON_DEMO_MODE=1 ARGON_METADATA_DB=argon_console_ci /tmp/argon-console-api >/tmp/argon-console-engine.log 2>&1 &
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:18081/api/v1/meta >/dev/null && break; sleep 1; done
          curl --fail --silent http://127.0.0.1:18081/api/v1/meta
      - name: Install browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Verify Undo, recovery, conflict review and responsive UI
        working-directory: web
        env:
          CONSOLE_URL: http://127.0.0.1:18081
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true # Optional evidence; the browser/build steps remain required.
        with:
          name: public-console-evidence
          path: |
            /tmp/argon-console-checks
            /tmp/argon-console-engine.log

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # Change streams (the ingest path) require a replica set, which service
    # containers can't be configured as — hence docker run.
    - name: Start MongoDB (single-node replica set)
      run: |
        docker run -d --name ci-mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
        for i in $(seq 1 30); do
          docker exec ci-mongo mongosh --quiet --eval 'db.runCommand({ping: 1})' && break
          sleep 1
        done
        docker exec ci-mongo mongosh --quiet --eval 'db.runCommand({ping: 1})'
        docker exec ci-mongo mongosh --quiet --eval 'rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}]})'
        for i in $(seq 1 30); do
          [ "$(docker exec ci-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary')" = "true" ] && break
          sleep 1
        done
        test "$(docker exec ci-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary')" = true
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    
    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
    
    - name: Download dependencies
      run: go mod download

    - name: Compile an external Go v2 consumer
      run: bash scripts/check-go-module.sh

    - uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Validate release metadata and installer
      run: |
        node scripts/release-version.js --check
        node --test scripts/release-version.test.js scripts/verify-npm-publication.test.mjs npm/scripts/install.test.js
        npm pack --dry-run ./npm

    - name: Start MinIO (S3 chunk store backend)
      run: |
        docker run -d --name ci-minio -p 9010:9000 \
          -e MINIO_ROOT_USER=argon -e MINIO_ROOT_PASSWORD=argon12345 \
          quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e server /data
        for i in $(seq 1 30); do
          curl -sf http://localhost:9010/minio/health/live && break
          sleep 1
        done
        curl -fsS http://localhost:9010/minio/health/live

    - name: Run tests
      env:
        ARGON_TEST_S3_ENDPOINT: http://localhost:9010
        ARGON_TEST_S3_BUCKET: argon-test
        AWS_ACCESS_KEY_ID: argon
        AWS_SECRET_ACCESS_KEY: argon12345
        AWS_REGION: us-east-1
      run: go test -v ./...
    
    - name: Test and build CLI
      working-directory: ./cli
      env:
        ARGON_TEST_MONGODB_URI: mongodb://localhost:27017/?replicaSet=rs0
      run: |
        go test ./...
        go build -v .

    - name: Test API
      working-directory: ./api
      run: go test -v ./...
    
  driver-compat:
    name: Driver Compatibility
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Start MongoDB (single-node replica set)
      run: |
        docker run -d --name compat-mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
        for i in $(seq 1 30); do
          docker exec compat-mongo mongosh --quiet --eval 'db.runCommand({ping: 1})' && break
          sleep 1
        done
        docker exec compat-mongo mongosh --quiet --eval 'db.runCommand({ping: 1})'
        docker exec compat-mongo mongosh --quiet --eval 'rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}]})'
        for i in $(seq 1 30); do
          [ "$(docker exec compat-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary')" = "true" ] && break
          sleep 1
        done
        test "$(docker exec compat-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary')" = true

    - name: Install Python driver
      run: pip install pymongo pytest

    - name: Run the driver-compat harness
      run: bash compat/run.sh

  lint:
    name: Vet (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: ['.', cli, api]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            cli/go.sum
            api/go.sum
      - name: Go vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

  vulnerabilities:
    name: Reachable Go vulnerabilities (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: ['.', cli, api]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            cli/go.sum
            api/go.sum
      - name: Install official vulnerability scanner
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - name: Scan reachable dependencies against the current database
        working-directory: ${{ matrix.module }}
        run: govulncheck ./...
