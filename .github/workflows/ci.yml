name: CI

on:
  workflow_call:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

# Every job only reads the repository. Actions are pinned to commit SHAs;
# Dependabot keeps the pins current (.github/dependabot.yml).
permissions:
  contents: read

env:
  MONGODB_IMAGE: mongo:7.0.45@sha256:c53852c00c23ca9f23fc39690350ffa9a80e3642fe8f96879726d8da0abe80a7
  # Tests of online import, following, resync and write-back. The Test job
  # skips these names and the Test (source features) job runs only these.
  SOURCE_TESTS: '^Test(Source|Follow|Resync|WriteBack|OnlineImport)'

jobs:
  console:
    name: Public console build and browser regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            api/go.sum
      - name: Verify public source reproduces embedded assets
        run: bash scripts/sync-ui.sh --check
      - name: Audit complete console dependency tree
        # Fails on any advisory that scripts/console-audit-exceptions.json does
        # not name. An exception holds only for build-time dependencies and
        # only while npm offers no compatible fix.
        run: |
          node --test scripts/console-audit.test.mjs
          node scripts/console-audit.mjs
      - name: Start disposable MongoDB replica set
        run: |
          trap 'docker logs console-mongo >&2 || true' ERR
          docker run -d --name console-mongo -p 127.0.0.1:27017:27017 "$MONGODB_IMAGE" --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do docker exec console-mongo mongosh --quiet --eval 'db.adminCommand({ping:1})' && break; sleep 1; done
          docker exec console-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          for i in $(seq 1 30); do docker exec console-mongo mongosh --quiet --eval 'if(!db.hello().isWritablePrimary)quit(1)' && break; sleep 1; done
          docker exec console-mongo mongosh --quiet --eval 'if(!db.hello().isWritablePrimary)quit(1)'
      - name: Build the same engine commit with embedded UI
        working-directory: api
        run: go build -o /tmp/argon-console-api .
      - name: Start production console in isolated demo mode
        run: |
          PORT=18081 ARGON_DEMO_MODE=1 ARGON_METADATA_DB=argon_console_ci /tmp/argon-console-api >/tmp/argon-console-engine.log 2>&1 &
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:18081/api/v1/meta >/dev/null && break; sleep 1; done
          curl --fail --silent http://127.0.0.1:18081/api/v1/meta
      - name: Install browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Verify Undo, recovery, conflict review and responsive UI
        working-directory: web
        env:
          CONSOLE_URL: http://127.0.0.1:18081
        run: npm run test:browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        continue-on-error: true # Optional evidence; the browser/build steps remain required.
        with:
          name: public-console-evidence
          path: |
            /tmp/argon-console-checks
            /tmp/argon-console-engine.log

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # Change streams (the ingest path) require a replica set, which service
    # containers can't be configured as — hence docker run.
    - name: Start MongoDB (single-node replica set)
      run: |
        trap 'docker logs ci-mongo >&2 || true' ERR
        docker run -d --name ci-mongo -p 27017:27017 "$MONGODB_IMAGE" --replSet rs0 --bind_ip_all
        for i in $(seq 1 30); do
          docker exec ci-mongo mongosh --quiet --eval 'db.runCommand({ping: 1})' && break
          sleep 1
        done
        docker exec ci-mongo mongosh --quiet --eval 'db.runCommand({ping: 1})'
        docker exec ci-mongo mongosh --quiet --eval 'rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}]})'
        for i in $(seq 1 30); do
          [ "$(docker exec ci-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary')" = "true" ] && break
          sleep 1
        done
        test "$(docker exec ci-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary')" = true

    # Online import, following and write-back are also tested with the source
    # database on a deployment other than the one holding the Argon metadata.
    - name: Start a second MongoDB replica set (source deployment)
      run: |
        trap 'docker logs ci-mongo-source >&2 || true' ERR
        docker run -d --name ci-mongo-source -p 27018:27018 "$MONGODB_IMAGE" --replSet rs1 --port 27018 --bind_ip_all
        for i in $(seq 1 30); do
          docker exec ci-mongo-source mongosh --quiet --port 27018 --eval 'db.runCommand({ping: 1})' && break
          sleep 1
        done
        docker exec ci-mongo-source mongosh --quiet --port 27018 --eval 'rs.initiate({_id: "rs1", members: [{_id: 0, host: "localhost:27018"}]})'
        for i in $(seq 1 30); do
          [ "$(docker exec ci-mongo-source mongosh --quiet --port 27018 --eval 'db.hello().isWritablePrimary')" = "true" ] && break
          sleep 1
        done
        test "$(docker exec ci-mongo-source mongosh --quiet --port 27018 --eval 'db.hello().isWritablePrimary')" = true
    
    - name: Set up Go
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version-file: go.mod
    
    - name: Cache Go modules
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
    
    - name: Download dependencies
      run: go mod download

    - name: Compile an external Go v2 consumer
      run: bash scripts/check-go-module.sh

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'

    - name: Validate release metadata and installer
      run: |
        node scripts/release-version.js --check
        node --test scripts/release-version.test.js scripts/verify-npm-publication.test.mjs scripts/npm-checksums.test.mjs npm/scripts/install.test.js npm/test/launcher.test.js
        npm pack --dry-run ./npm

    - name: Start MinIO (S3 chunk store backend)
      run: |
        # Build the same official RELEASE.2025-09-07T16-13-09Z source:
        # the historical container registries no longer allow anonymous pulls.
        GOBIN="$RUNNER_TEMP/minio-bin" go install github.com/minio/minio@07c3a429bfed433e49018cb0f78a52145d4bedeb
        mkdir -p "$RUNNER_TEMP/minio-data"
        MINIO_ROOT_USER=argon MINIO_ROOT_PASSWORD=argon12345 \
          "$RUNNER_TEMP/minio-bin/minio" server "$RUNNER_TEMP/minio-data" \
          --address 127.0.0.1:9010 >"$RUNNER_TEMP/minio.log" 2>&1 &
        for i in $(seq 1 30); do
          curl -sf http://localhost:9010/minio/health/live && break
          sleep 1
        done
        if ! curl -fsS http://localhost:9010/minio/health/live; then
          cat "$RUNNER_TEMP/minio.log"
          exit 1
        fi

    # The engine is concurrent throughout (capture, snapshots, monitors),
    # so every suite runs under the race detector.
    - name: Run tests
      env:
        ARGON_TEST_S3_ENDPOINT: http://localhost:9010
        ARGON_TEST_S3_BUCKET: argon-test
        AWS_ACCESS_KEY_ID: argon
        AWS_SECRET_ACCESS_KEY: argon12345
        AWS_REGION: us-east-1
        ARGON_TEST_SOURCE_MONGODB_URI: mongodb://localhost:27018/?replicaSet=rs1
      # The source-feature tests (online import, following, resync,
      # write-back) run in the "Test (source features)" job. The two jobs
      # divide the tests by the same name pattern, so every test runs in
      # exactly one of them.
      run: go test -race -v -timeout 25m -skip "$SOURCE_TESTS" ./...

    # The wire proxy parses bytes from unauthenticated sockets. The seed
    # corpus runs with the tests above; this explores beyond it briefly.
    - name: Fuzz the wire-protocol frame parser
      run: go test ./internal/wireproxy -run '^$' -fuzz FuzzRewrite -fuzztime 300000x

    - name: Test and build CLI
      working-directory: ./cli
      env:
        ARGON_TEST_MONGODB_URI: mongodb://localhost:27017/?replicaSet=rs0
      run: |
        go test -race ./...
        go build -v .

    - name: Test API
      working-directory: ./api
      run: go test -race -v ./...
    
  # Online import, following, resync and write-back against two replica
  # sets. They are the slowest tests in the repository and run beside the
  # rest instead of after them.
  test-source:
    name: Test (source features)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # Change streams (the ingest path) require a replica set, which service
    # containers can't be configured as — hence docker run.
    - name: Start MongoDB (single-node replica set)
      run: |
        trap 'docker logs ci-mongo >&2 || true' ERR
        docker run -d --name ci-mongo -p 27017:27017 "$MONGODB_IMAGE" --replSet rs0 --bind_ip_all
        for i in $(seq 1 30); do
          docker exec ci-mongo mongosh --quiet --eval 'db.runCommand({ping: 1})' && break
          sleep 1
        done
        docker exec ci-mongo mongosh --quiet --eval 'db.runCommand({ping: 1})'
        docker exec ci-mongo mongosh --quiet --eval 'rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}]})'
        for i in $(seq 1 30); do
          [ "$(docker exec ci-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary')" = "true" ] && break
          sleep 1
        done
        test "$(docker exec ci-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary')" = true

    # Online import, following and write-back are also tested with the source
    # database on a deployment other than the one holding the Argon metadata.
    - name: Start a second MongoDB replica set (source deployment)
      run: |
        trap 'docker logs ci-mongo-source >&2 || true' ERR
        docker run -d --name ci-mongo-source -p 27018:27018 "$MONGODB_IMAGE" --replSet rs1 --port 27018 --bind_ip_all
        for i in $(seq 1 30); do
          docker exec ci-mongo-source mongosh --quiet --port 27018 --eval 'db.runCommand({ping: 1})' && break
          sleep 1
        done
        docker exec ci-mongo-source mongosh --quiet --port 27018 --eval 'rs.initiate({_id: "rs1", members: [{_id: 0, host: "localhost:27018"}]})'
        for i in $(seq 1 30); do
          [ "$(docker exec ci-mongo-source mongosh --quiet --port 27018 --eval 'db.hello().isWritablePrimary')" = "true" ] && break
          sleep 1
        done
        test "$(docker exec ci-mongo-source mongosh --quiet --port 27018 --eval 'db.hello().isWritablePrimary')" = true
    
    - name: Set up Go
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version-file: go.mod

    - name: Run the source-feature tests
      env:
        ARGON_TEST_SOURCE_MONGODB_URI: mongodb://localhost:27018/?replicaSet=rs1
      run: go test -race -v -timeout 25m -run "$SOURCE_TESTS" ./...

  sandbox-credentials:
    name: Test (sandbox credentials)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Start authenticated single-member replica set
        run: |
          docker run -d --name ci-sandbox-mongo -p 127.0.0.1:27019:27019 \
            --entrypoint bash "$MONGODB_IMAGE" -ec '
              umask 077
              head -c 48 /dev/urandom | base64 > /tmp/sandbox-rs-key
              chown mongodb:mongodb /tmp/sandbox-rs-key
              exec docker-entrypoint.sh mongod --auth --keyFile /tmp/sandbox-rs-key \
                --replSet rs0 --port 27019 --bind_ip_all'
          mongo=(docker exec ci-sandbox-mongo mongosh --quiet --port 27019 --eval)
          for i in $(seq 1 30); do "${mongo[@]}" 'db.adminCommand({ping:1})' && break; sleep 1; done
          "${mongo[@]}" 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27019"}]})'
          for i in $(seq 1 30); do "${mongo[@]}" 'if (!db.hello().isWritablePrimary) quit(1)' && break; sleep 1; done
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          docker exec -e TEST_PASSWORD="$password" ci-sandbox-mongo mongosh --quiet --port 27019 \
            admin --eval 'db.createUser({user:"sandbox_ci",pwd:process.env.TEST_PASSWORD,roles:["root"]})'
          echo "ARGON_TEST_AUTH_MONGODB_URI=mongodb://sandbox_ci:$password@localhost:27019/?authSource=admin&replicaSet=rs0" >> "$GITHUB_ENV"
      - name: Exercise scoped access and revocation
        run: |
          set -o pipefail
          go test -race -v -count=1 -run '^TestSandboxCredential' ./tests/wal ./pkg/mcpserver
          (cd cli && go test -race -v -count=1 -run '^(TestSandboxCredential|TestDoctorProbeCleansUp|TestReview|TestRound2Doctor)' ./cmd 2>&1 | tee /tmp/cli-auth.log)
          # The doctor's cleanup tests need this deployment's access control; a skip would pass quietly.
          grep -q -- '--- PASS: TestDoctorProbeCleansUpWhenDropDatabaseIsRefused' /tmp/cli-auth.log
          if grep -- '--- SKIP' /tmp/cli-auth.log; then
            echo "::error::A test skipped although the authenticated deployment is available."
            exit 1
          fi
          (cd api && go test -race -v -count=1 -run '^TestSandboxCredential' ./server)
      - name: Remove authenticated deployment and volumes
        if: always()
        run: docker rm -fv ci-sandbox-mongo

  driver-compat:
    name: Driver Compatibility
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version-file: go.mod

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'

    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'

    - name: Start MongoDB (single-node replica set)
      run: |
        trap 'docker logs compat-mongo >&2 || true' ERR
        docker run -d --name compat-mongo -p 27017:27017 "$MONGODB_IMAGE" --replSet rs0 --bind_ip_all
        for i in $(seq 1 30); do
          docker exec compat-mongo mongosh --quiet --eval 'db.runCommand({ping: 1})' && break
          sleep 1
        done
        docker exec compat-mongo mongosh --quiet --eval 'db.runCommand({ping: 1})'
        docker exec compat-mongo mongosh --quiet --eval 'rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}]})'
        for i in $(seq 1 30); do
          [ "$(docker exec compat-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary')" = "true" ] && break
          sleep 1
        done
        test "$(docker exec compat-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary')" = true

    - name: Install Python driver
      run: pip install pymongo pytest

    - name: Run the driver-compat harness
      run: bash compat/run.sh

  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: gofmt
        run: |
          unformatted=$(gofmt -l . | grep -v '^api/server/ui/' || true)
          if [ -n "$unformatted" ]; then
            echo "Run gofmt -w on:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

  lint:
    name: Vet (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: ['.', cli, api]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            cli/go.sum
            api/go.sum
      - name: Go vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      # Configured by .golangci.yml at the repository root.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.1
          working-directory: ${{ matrix.module }}

  vulnerabilities:
    name: Reachable Go vulnerabilities (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: ['.', cli, api]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            cli/go.sum
            api/go.sum
      - name: Install official vulnerability scanner
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Scan reachable dependencies against the current database
        working-directory: ${{ matrix.module }}
        run: govulncheck ./...

  source-auth:
    name: Source authentication and TLS
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/test-source-deployment.sh auth
        env:
          ENGINE_IMAGE: ${{ env.MONGODB_IMAGE }}
          SOURCE_IMAGE: ${{ env.MONGODB_IMAGE }}

  source-elections:
    name: Three-member source elections
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/test-source-deployment.sh rs3
        env:
          ENGINE_IMAGE: ${{ env.MONGODB_IMAGE }}
          SOURCE_IMAGE: ${{ env.MONGODB_IMAGE }}

  source-versions:
    name: Source ${{ matrix.source }} with engine ${{ matrix.engine }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - source: '6.0.28'
            engine: '7.0.45'
          - source: '8.0.38'
            engine: '7.0.45'
          - source: '7.0.45'
            engine: '8.0.38'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/test-source-deployment.sh versions
        env:
          ENGINE_IMAGE: mongo:${{ matrix.engine }}
          SOURCE_IMAGE: mongo:${{ matrix.source }}
