name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate the tagged source
    uses: ./.github/workflows/ci.yml

  prepare:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Resolve the authoritative tag
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(node scripts/release-version.js "$RELEASE_TAG" --check)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Nested Go modules need their own semantic-version tag. Both tags
          # must identify the reviewed source that the reusable CI validates.
          test "$(git rev-parse "refs/tags/api/v${version}^{commit}")" = "$(git rev-parse HEAD)"
      - name: Check release tooling
        run: node --test scripts/release-version.test.js scripts/verify-npm-publication.test.mjs scripts/npm-checksums.test.mjs npm/scripts/install.test.js

  release:
    name: Build and publish verified binaries
    needs: [prepare, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            cli/go.sum
            api/go.sum
      # Cross-compile in one job. Final release assets are uploaded directly;
      # publication does not depend on temporary Actions artifact storage.
      - name: Build every supported platform
        working-directory: cli
        env:
          CGO_ENABLED: '0'
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p ../dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            export GOOS="${target%/*}" GOARCH="${target#*/}"
            asset="argon-${GOOS}-${GOARCH}"
            if [ "$GOOS" = windows ]; then asset="$asset.exe"; fi
            go build -trimpath -ldflags="-s -w -X github.com/argon-lab/argon/v2/pkg/version.Build=$RELEASE_VERSION" -o "../dist/$asset" .
          done
      - name: Record engine, public console and binary provenance
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/release-provenance.mjs dist
      - name: Generate checksums
        working-directory: dist
        run: sha256sum argon-* release-provenance.json > SHA256SUMS
      - name: Create release with all required assets
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(needs.prepare.outputs.version, '-') }}

  publish-npm:
    name: Publish to npm
    needs: [prepare, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - name: Stamp package from release tag
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/release-version.js "$RELEASE_VERSION"
      # The package carries the digests of the binaries just released, and
      # its installer refuses a download that does not match them.
      - name: Embed the released binaries' checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release download "$RELEASE_TAG" --pattern SHA256SUMS --dir "$RUNNER_TEMP/release"
          node scripts/npm-checksums.mjs "$RUNNER_TEMP/release/SHA256SUMS"
      - name: Check package contents
        working-directory: npm
        run: |
          npm pack --dry-run
          npm pack --dry-run --json | node -e 'const files=JSON.parse(require("fs").readFileSync(0))[0].files.map(f=>f.path); if(!files.includes("checksums.json")) { console.error("checksums.json is missing from the package"); process.exit(1); }'
      # Install the exact tarball about to be published, the way a user
      # would. It downloads the real release binary and verifies it, so a
      # package that cannot install never reaches the registry.
      - name: Install the packed tarball before publishing it
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          tarball="$(cd npm && npm pack --pack-destination "$RUNNER_TEMP" --json | node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(0))[0].filename)')"
          prefix="$RUNNER_TEMP/argon-prepublish"
          npm install --global --prefix "$prefix" --no-audit --no-fund --foreground-scripts --allow-scripts=argonctl "$RUNNER_TEMP/$tarball"
          installed="$("$prefix/bin/argon" --version)"
          echo "$installed"
          test "$installed" = "argon version $RELEASE_VERSION"
      - name: Publish to npm
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          dist_tag=latest
          if [[ "$RELEASE_VERSION" == *-* ]]; then dist_tag=next; fi
          npm publish --access public --tag "$dist_tag"
      - name: Verify public registry visibility and a fresh installation
        timeout-minutes: 20
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          args=(--version "$RELEASE_VERSION")
          if [[ "$RELEASE_VERSION" == *-* ]]; then args+=(--allow-prerelease); fi
          node scripts/verify-npm-publication.mjs "${args[@]}"

  publish-mcp:
    name: Publish to MCP Registry
    needs: [prepare, publish-npm]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-mcp.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
