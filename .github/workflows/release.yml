name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate the tagged source
    uses: ./.github/workflows/ci.yml

  prepare:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve the authoritative tag
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(node scripts/release-version.js "$RELEASE_TAG" --check)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Nested Go modules need their own semantic-version tag. Both tags
          # must identify the reviewed source that the reusable CI validates.
          test "$(git rev-parse "refs/tags/api/v${version}^{commit}")" = "$(git rev-parse HEAD)"
      - name: Check release tooling
        run: node --test scripts/release-version.test.js npm/scripts/install.test.js

  release:
    name: Build and publish verified binaries
    needs: [prepare, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            cli/go.sum
            api/go.sum
      # Cross-compile in one job. Final release assets are uploaded directly;
      # publication does not depend on temporary Actions artifact storage.
      - name: Build every supported platform
        working-directory: cli
        env:
          CGO_ENABLED: '0'
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p ../dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            export GOOS="${target%/*}" GOARCH="${target#*/}"
            asset="argon-${GOOS}-${GOARCH}"
            if [ "$GOOS" = windows ]; then asset="$asset.exe"; fi
            go build -trimpath -ldflags="-s -w -X github.com/argon-lab/argon/v2/pkg/version.Build=$RELEASE_VERSION" -o "../dist/$asset" .
          done
      - name: Record engine, public console and binary provenance
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/release-provenance.mjs dist
      - name: Generate checksums
        working-directory: dist
        run: sha256sum argon-* release-provenance.json > SHA256SUMS
      - name: Create release with all required assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(needs.prepare.outputs.version, '-') }}

  publish-npm:
    name: Publish to npm
    needs: [prepare, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - name: Stamp package from release tag
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/release-version.js "$RELEASE_VERSION"
      - name: Check package contents
        working-directory: npm
        run: npm pack --dry-run
      - name: Publish to npm
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          dist_tag=latest
          if [[ "$RELEASE_VERSION" == *-* ]]; then dist_tag=next; fi
          npm publish --access public --tag "$dist_tag"

  publish-mcp:
    name: Publish to MCP Registry
    needs: [prepare, publish-npm]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-mcp.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
