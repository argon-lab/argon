name: Publish to MCP Registry

# Called explicitly after npm succeeds: release events created with GITHUB_TOKEN
# do not start another workflow. Manual dispatch is available for recovery.
on:
  workflow_call:
    inputs:
      version:
        description: Published npm version
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Published npm version, for example 2.0.1
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and stamp the requested version
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          version=$(node scripts/release-version.js "$RELEASE_VERSION")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Verify npm publication is visible
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          for attempt in $(seq 1 12); do
            if [ "$(npm view "argonctl@$RELEASE_VERSION" mcpName 2>/dev/null)" = io.github.argon-lab/argon ]; then
              exit 0
            fi
            sleep 5
          done
          echo 'The matching argonctl package with mcpName is not visible on npm.' >&2
          exit 1
      - name: Install mcp-publisher
        run: |
          curl --fail --location --retry 3 --output mcp-publisher.tar.gz https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz
          tar -xzf mcp-publisher.tar.gz mcp-publisher
      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish
        run: ./mcp-publisher publish
