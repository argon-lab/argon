name: Publish to MCP Registry

# Called explicitly after npm succeeds: release events created with GITHUB_TOKEN
# do not start another workflow. Manual dispatch is available for recovery.
on:
  workflow_call:
    inputs:
      version:
        description: Published npm version
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Published npm version, for example 2.0.1
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Validate and stamp the requested version
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          version=$(node scripts/release-version.js "$RELEASE_VERSION")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Verify npm publication is visible
        timeout-minutes: 20
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          args=(--version "$RELEASE_VERSION" --metadata-only)
          if [[ "$RELEASE_VERSION" == *-* ]]; then args+=(--allow-prerelease); fi
          node scripts/verify-npm-publication.mjs "${args[@]}"
      - name: Install mcp-publisher
        run: |
          curl --fail --location --retry 3 --output mcp-publisher.tar.gz https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz
          tar -xzf mcp-publisher.tar.gz mcp-publisher
      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish
        run: ./mcp-publisher publish
